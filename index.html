<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111a2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Choruswild</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><span></span><i></i><b></b></div>
        <div><div class="brand">CHORUSWILD</div><div class="subtitle" id="islandSubtitle">A living orchestra</div></div>
      </div>
      <div class="currency-strip" id="currencyStrip"></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">SET</button>
    </header>

    <main>
      <section class="world-shell" id="worldShell">
        <div class="world-heading">
          <div>
            <div class="eyebrow" id="worldType">ISLAND</div>
            <h1 id="worldName">Meadowreach</h1>
            <p id="worldDesc">Where the first beat wakes the grass.</p>
          </div>
          <div class="world-actions">
            <button class="secondary" id="collectAllBtn">COLLECT</button>
            <button class="secondary" id="mapBtn">MAP</button>
            <button class="primary" id="performanceBtn">PLAY SONG</button>
          </div>
        </div>
        <div class="landscape-frame">
          <div class="sky-noise"></div>
          <div id="landscape"></div>
          <div class="monster-stage" id="monsterStage"></div>
          <div class="empty-stage" id="emptyStage">
            <strong>This island is waiting for its first performer.</strong>
            <span>Open Market to place a starter monster.</span>
          </div>
          <div class="mix-strip" id="mixStrip"></div>
        </div>
        <div class="progress-row">
          <div class="progress-card"><span>Castle</span><b id="castleLabel">Level 1</b><div class="meter"><i id="castleMeter"></i></div></div>
          <div class="progress-card"><span>Song power</span><b id="songPowerLabel">0</b><div class="meter"><i id="songPowerMeter"></i></div></div>
          <div class="progress-card"><span>Lanterns</span><b id="torchLabel">0 / 10</b><div class="meter"><i id="torchMeter"></i></div></div>
        </div>
      </section>
    </main>

    <nav class="dock" id="dock">
      <button data-panel="market"><span class="dock-icon">M</span><small>Market</small></button>
      <button data-panel="breed"><span class="dock-icon">B</span><small>Breed</small></button>
      <button data-panel="collection"><span class="dock-icon">C</span><small>Collection</small></button>
      <button data-panel="goals"><span class="dock-icon">G</span><small>Goals</small></button>
      <button data-panel="arcade"><span class="dock-icon">A</span><small>Arcade</small></button>
      <button data-panel="island"><span class="dock-icon">I</span><small>Island</small></button>
    </nav>
  </div>

  <div class="modal-layer hidden" id="modalLayer" role="dialog" aria-modal="true">
    <section class="modal-card">
      <header class="modal-header"><div><div class="eyebrow" id="modalEyebrow">CHORUSWILD</div><h2 id="modalTitle">Panel</h2></div><button class="icon-btn" id="closeModalBtn">CLOSE</button></header>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
